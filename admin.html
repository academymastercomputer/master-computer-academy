<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Computer Academy - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}
h2 { color: #b00000; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
}
button {
  background: #b00000;
  color: white;
  border: 0;
  cursor: pointer;
  border-radius: 5px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}
th { background: #eee; }
#dashboard { display: none; }
#message { color: #b00000; }
</style>
</head>
<body>

<div class="container">
<h2 id="mainHeading">Master Computer Academy</h2>
<h3>Login</h3>

<div id="login">
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>

<p id="message"></p>

<div id="dashboard">
<h3 id="dashboardTitle">Dashboard</h3>
  <hr>
<div id="branchManagementSection">
<h3>Branch Management</h3>

<h4>Add New Branch</h4>

<input type="text" id="branchName" placeholder="Branch Name">

<input type="text" id="branchCode" placeholder="Branch Code">

<button id="addBranch">Add Branch</button>

<p id="branchMessage"></p>

<h4>All Branches</h4>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Branch Name</th>
<th>Branch Code</th>
<th>Action</th>
</tr>
</thead>
<tbody id="branchList"></tbody>
</table>
</div>
</div>
  
<hr>
<p id="welcome"></p>
<button id="refresh">Refresh Students</button>
<button id="logout">Logout</button>

<h3>Student Registrations</h3>
 <div style="background:#e3f2fd; padding:15px; border-radius:8px;">
<table style="width:100%; border-collapse:collapse; margin:15px 0;">
  <thead>
    <tr style="background:#b00000; color:#ffffff;">
      <th style="padding:12px; color:white !important;">Details</th>
      <th style="padding:12px; color:white !important;">Count</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Total Students</td>
      <td id="totalStudents">0</td>
    </tr>
    <tr>
      <td>Approved</td>
      <td id="approvedStudents">0</td>
    </tr>
    <tr>
      <td>New</td>
      <td id="newStudents">0</td>
    </tr>
    <tr>
      <td>Rejected</td>
      <td id="rejectedStudents">0</td>
    </tr>
  </tbody>
</table>
 </div>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>S.No.</th>
<th>Photo</th>
<th>Name</th>
<th>Father Name</th>
<th>Mobile</th>
<th>Course</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="studentList"></tbody>
</table>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://qzzrmmefdpckwblicaod.supabase.co";
const SUPABASE_KEY = "sb_publishable_fdBsDqavTxcWkYQJJxfMdg_R_5b-596";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
let currentProfile = null;
// ADMIN LOGIN
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  message.textContent = "Checking login...";

  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  const { data: profile, error: profileError } = await db
    .from("profiles")
    .select("role, full_name, branch_id")
    .eq("id", data.user.id)
    .single();

 if (
  profileError ||
  !profile ||
  !["admin", "branch"].includes(profile.role) ||
  (profile.role === "branch" && !profile.branch_id)
) {
  message.textContent = "Admin access denied.";
  await db.auth.signOut();
  return;
}

currentProfile = profile;
  document.getElementById("dashboardTitle").textContent =
  currentProfile.role === "admin" ? "Admin Dashboard" : "Branch Dashboard";

if (currentProfile.role === "branch") {
  document.getElementById("branchManagementSection").style.display = "none";
}

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  if (currentProfile.role === "branch") {
  document.getElementById("mainHeading").textContent =
    "Welcome to Master Computer Academy " + currentProfile.full_name;
} else {
  document.getElementById("mainHeading").textContent =
    "Master Computer Academy";
}

document.getElementById("welcome").style.display = "none";

  message.textContent = "";

  loadStudents();
 if (currentProfile.role === "admin") {
  loadBranches();
}
});

// BRANCH MANAGEMENT

async function loadBranches() {
  const { data, error } = await db
    .from("branches")
    .select("id, name, code")
    .order("name");

  const list = document.getElementById("branchList");
  list.replaceChildren();

  if (error) {
    document.getElementById("branchMessage").textContent =
      "Unable to load branches: " + error.message;
    return;
  }

  data.forEach(branch => {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    nameTd.textContent = branch.name;

    const codeTd = document.createElement("td");
    codeTd.textContent = branch.code;

    const actionTd = document.createElement("td");

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";

    editBtn.onclick = async () => {
      const newName = prompt("Branch Name:", branch.name);
      if (newName === null) return;

      const newCode = prompt("Branch Code:", branch.code);
      if (newCode === null) return;

      if (!newName.trim() || !newCode.trim()) {
        alert("Please enter Branch Name and Code.");
        return;
      }

      const { error } = await db
        .from("branches")
        .update({
          name: newName.trim(),
          code: newCode.trim().toLowerCase()
        })
        .eq("id", branch.id);

      if (error) {
        alert("Update Failed: " + error.message);
      } else {
        alert("Branch Updated Successfully!");
        loadBranches();
      }
    };

    actionTd.appendChild(editBtn);
    tr.append(nameTd, codeTd, actionTd);
    list.appendChild(tr);
  });
}


// ADD NEW BRANCH

document.getElementById("addBranch").onclick = async () => {
  const name = document.getElementById("branchName").value.trim();
  const code = document.getElementById("branchCode").value.trim().toLowerCase();

  const branchMessage = document.getElementById("branchMessage");

  if (!name || !code) {
    branchMessage.textContent = "Please enter Branch Name and Code.";
    return;
  }

  const { error } = await db
    .from("branches")
    .insert([{ name: name, code: code }]);

  if (error) {
    branchMessage.textContent = "Add Branch Failed: " + error.message;
    return;
  }

  document.getElementById("branchName").value = "";
  document.getElementById("branchCode").value = "";

  branchMessage.textContent = "Branch Added Successfully!";
  loadBranches();
};
// LOAD STUDENTS
async function loadStudents() {

  let query = db
  .from("students")
  .select("id, student_name, father_name, mother_name, mobile, email, course_name, status, photo_path");

if (currentProfile?.role === "branch") {
  query = query.eq("branch_id", currentProfile.branch_id);
}

const { data, error } = await query
  .order("created_at", { ascending: false });

  const list = document.getElementById("studentList");
  list.replaceChildren();

  if (error) {
    message.textContent = "Unable to load students: " + error.message;
    return;
  }
// STUDENT COUNTING

document.getElementById("totalStudents").textContent = data.length;

document.getElementById("approvedStudents").textContent =
  data.filter(s => s.status === "Approved").length;

document.getElementById("newStudents").textContent =
  data.filter(s => s.status === "New").length;

document.getElementById("rejectedStudents").textContent =
  data.filter(s => s.status === "Rejected").length;
  let serialNumber = 1;
  for (const student of data) {

    const tr = document.createElement("tr");
    const serialCell = document.createElement("td");
serialCell.textContent = serialNumber++;
tr.appendChild(serialCell);
const photoCell = document.createElement("td");

if (student.photo_path) {
  const { data: photoData, error: photoError } = await db
    .storage
    .from("student-photos")
    .createSignedUrl(student.photo_path, 3600);

  if (photoData && !photoError) {
    const img = document.createElement("img");
    img.src = photoData.signedUrl;
    img.width = 50;
    img.height = 50;
    img.style.objectFit = "cover";
    img.style.borderRadius = "5px";
    photoCell.appendChild(img);
  } else {
    photoCell.textContent = "No Photo";
  }
} else {
  photoCell.textContent = "No Photo";
}

tr.appendChild(photoCell);

[
  student.student_name,
  student.father_name,
  student.mobile,
  student.course_name,
  student.status
].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value || "-";
      tr.appendChild(td);
    });

    const actionTd = document.createElement("td");


    // VIEW BUTTON
    const viewBtn = document.createElement("button");
    viewBtn.textContent = "View";
    viewBtn.style.background = "blue";

    viewBtn.onclick = async () => {

  let photoUrl = null;

  if (student.photo_path) {
    const { data, error } = await db
      .storage
      .from("student-photos")
      .createSignedUrl(student.photo_path, 3600);

    if (error) {
      alert("Photo loading failed: " + error.message);
    } else {
      photoUrl = data.signedUrl;
    }
  }

  const modal = document.createElement("div");

  modal.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
  `;

  const box = document.createElement("div");

  box.style.cssText = `
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    max-width:450px;
    width:100%;
    max-height:90vh;
    overflow:auto;
  `;

  if (photoUrl) {
    const img = document.createElement("img");
    img.src = photoUrl;
    img.style.cssText = `
      width:130px;
      height:130px;
      object-fit:cover;
      border-radius:10px;
      display:block;
      margin:0 auto 15px;
    `;
    box.appendChild(img);
  } else {
    const noPhoto = document.createElement("p");
    noPhoto.textContent = "No Student Photo Available";
    box.appendChild(noPhoto);
  }

  const details = document.createElement("pre");

  details.style.cssText = `
    white-space:pre-wrap;
    font-family:Arial;
    line-height:1.7;
  `;

  details.textContent =
    "Student Name: " + student.student_name +
    "\nFather Name: " + student.father_name +
    "\nMother Name: " + (student.mother_name || "") +
    "\nMobile: " + student.mobile +
    "\nEmail: " + (student.email || "") +
    "\nCourse: " + student.course_name +
    "\nStatus: " + student.status;

  box.appendChild(details);

  const closeBtn = document.createElement("button");
  closeBtn.textContent = "Close";
  closeBtn.onclick = () => modal.remove();

  box.appendChild(closeBtn);
  modal.appendChild(box);
  document.body.appendChild(modal);
};
    actionTd.appendChild(viewBtn);


  // EDIT BUTTON
const editBtn = document.createElement("button");
editBtn.textContent = "Edit";
editBtn.style.background = "green";

editBtn.onclick = async () => {

  let oldPhotoPath = student.photo_path || null;
  let newPhotoFile = null;

  const modal = document.createElement("div");
  modal.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:15px;
  `;

  const box = document.createElement("div");
  box.style.cssText = `
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:450px;
    max-height:90vh;
    overflow:auto;
  `;

  const heading = document.createElement("h2");
  heading.textContent = "Edit Student Details";
  box.appendChild(heading);

  const photoTitle = document.createElement("p");
  photoTitle.textContent = "Current Student Photo";
  box.appendChild(photoTitle);

  const img = document.createElement("img");
  img.style.cssText = `
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin-bottom:12px;
  `;

  if (oldPhotoPath) {
    const { data, error } = await db.storage
      .from("student-photos")
      .createSignedUrl(oldPhotoPath, 3600);

    if (!error) {
      img.src = data.signedUrl;
      box.appendChild(img);
    } else {
      photoTitle.textContent = "Current photo could not be loaded.";
    }
  } else {
    photoTitle.textContent = "No current photo available.";
  }

  function makeInput(labelText, value) {
    const label = document.createElement("label");
    label.textContent = labelText;
    label.style.display = "block";
    label.style.marginTop = "12px";

    const input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    input.style.cssText = `
      width:100%;
      padding:9px;
      box-sizing:border-box;
      margin-top:5px;
    `;

    box.appendChild(label);
    box.appendChild(input);
    return input;
  }

  const nameInput = makeInput("Student Name", student.student_name);
  const fatherInput = makeInput("Father Name", student.father_name);
  const mobileInput = makeInput("Mobile Number", student.mobile);
  const emailInput = makeInput("Email", student.email);
  const courseInput = makeInput("Course", student.course_name);

  const photoLabel = document.createElement("p");
  photoLabel.textContent = "Choose New Photo (Optional)";
  photoLabel.style.marginTop = "15px";
  box.appendChild(photoLabel);

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/jpeg,image/png,image/webp";
  box.appendChild(fileInput);

  fileInput.onchange = () => {
    newPhotoFile = fileInput.files[0] || null;

    if (newPhotoFile) {
      img.src = URL.createObjectURL(newPhotoFile);

      if (!box.contains(img)) {
        box.insertBefore(img, photoLabel);
      }
    }
  };

  const saveBtn = document.createElement("button");
  saveBtn.textContent = "Save Changes";
  saveBtn.style.cssText = `
    background:green;
    color:white;
    padding:10px 15px;
    margin-top:20px;
    border:0;
    cursor:pointer;
  `;

  const cancelBtn = document.createElement("button");
  cancelBtn.textContent = "Cancel";
  cancelBtn.style.cssText = `
    background:gray;
    color:white;
    padding:10px 15px;
    margin:20px 0 0 10px;
    border:0;
    cursor:pointer;
  `;

  cancelBtn.onclick = () => modal.remove();

  saveBtn.onclick = async () => {

    const newName = nameInput.value.trim();
    const newFather = fatherInput.value.trim();
    const newMobile = mobileInput.value.trim();
    const newEmail = emailInput.value.trim();
    const newCourse = courseInput.value.trim();

    if (!newName || !newFather || !newMobile || !newCourse) {
      alert("Please fill all required details.");
      return;
    }

    if (newPhotoFile) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(newPhotoFile.type)) {
        alert("Please select JPG, PNG or WEBP photo.");
        return;
      }

      if (newPhotoFile.size > 5 * 1024 * 1024) {
        alert("Photo size must be less than 5 MB.");
        return;
      }
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    let newPhotoPath = oldPhotoPath;

    if (newPhotoFile) {
      const extension = newPhotoFile.name.split(".").pop().toLowerCase();
      newPhotoPath = crypto.randomUUID() + "." + extension;

      const { error: uploadError } = await db.storage
        .from("student-photos")
        .upload(newPhotoPath, newPhotoFile, {
          cacheControl: "3600",
          upsert: false,
          contentType: newPhotoFile.type
        });

      if (uploadError) {
        alert("Photo Upload Failed: " + uploadError.message);
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
        return;
      }
    }

    const { error } = await db
      .from("students")
      .update({
        student_name: newName,
        father_name: newFather,
        mobile: newMobile,
        email: newEmail,
        course_name: newCourse,
        photo_path: newPhotoPath
      })
      .eq("id", student.id);

    if (error) {
      if (newPhotoFile && newPhotoPath) {
        await db.storage.from("student-photos").remove([newPhotoPath]);
      }

      alert("Update Failed: " + error.message);
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
      return;
    }

    if (newPhotoFile && oldPhotoPath) {
      const { error: deleteError } = await db.storage
        .from("student-photos")
        .remove([oldPhotoPath]);

      if (deleteError) {
        alert("Details updated, but old photo could not be deleted: " + deleteError.message);
      }
    }

    URL.revokeObjectURL(img.src);
    modal.remove();

    alert("Student Details Updated Successfully!");
    loadStudents();
  };

  box.appendChild(saveBtn);
  box.appendChild(cancelBtn);
  modal.appendChild(box);
  document.body.appendChild(modal);
};

actionTd.appendChild(editBtn);


    // STATUS DROPDOWN
    const statusSelect = document.createElement("select");

    ["New", "Approved", "Rejected"].forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = student.status || "New";

    statusSelect.onchange = async () => {

      const oldStatus = student.status;
      const newStatus = statusSelect.value;

      statusSelect.disabled = true;

      const { error } = await db
        .from("students")
        .update({ status: newStatus })
        .eq("id", student.id);

      if (error) {
        message.textContent = "Status Update Failed: " + error.message;
        statusSelect.value = oldStatus || "New";
      } else {
        student.status = newStatus;
        message.textContent = "Student Status Updated Successfully!";
      }

      statusSelect.disabled = false;
    };

    actionTd.appendChild(statusSelect);


    // DELETE BUTTON
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.style.background = "red";

    deleteBtn.onclick = async () => {

      if (!confirm("Are you sure you want to delete this student?")) {
        return;
      }

      const { error } = await db
        .from("students")
        .delete()
        .eq("id", student.id);

      if (error) {
        alert("Delete failed: " + error.message);
        return;
      }

      alert("Student Deleted Successfully!");
      loadStudents();
    };

    actionTd.appendChild(deleteBtn);

    tr.appendChild(actionTd);
    list.appendChild(tr);

   }

  message.textContent = "Total Students: " + data.length;
}


// REFRESH
document.getElementById("refresh").onclick = loadStudents;


// LOGOUT
document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

</script>

</body>
</html>
