<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Computer Academy - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}
h2 { color: #b00000; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
}
button {
  background: #b00000;
  color: white;
  border: 0;
  cursor: pointer;
  border-radius: 5px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}
th { background: #eee; }
#dashboard { display: none; }
#message { color: #b00000; }
</style>
</head>
<body>

<div class="container">
<h2>Master Computer Academy</h2>
<h3>Admin Login</h3>

<div id="login">
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>

<p id="message"></p>

<div id="dashboard">
<h3>Admin Dashboard</h3>
<p id="welcome"></p>
<button id="refresh">Refresh Students</button>
<button id="logout">Logout</button>

<h3>Student Registrations</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Name</th>
<th>Father Name</th>
<th>Mobile</th>
<th>Course</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="studentList"></tbody>
</table>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://qzzrmmefdpckwblicaod.supabase.co";
const SUPABASE_KEY = "sb_publishable_fdBsDqavTxcWkYQJJxfMdg_R_5b-596";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

// ADMIN LOGIN
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  message.textContent = "Checking login...";

  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  const { data: profile, error: profileError } = await db
    .from("profiles")
    .select("role, full_name")
    .eq("id", data.user.id)
    .single();

  if (profileError || !profile || profile.role !== "admin") {
    message.textContent = "Admin access denied.";
    await db.auth.signOut();
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  document.getElementById("welcome").textContent =
    "Welcome, " + (profile.fullname || "Admin");

  message.textContent = "";

  loadStudents();
});


// LOAD STUDENTS
async function loadStudents() {

  const { data, error } = await db
    .from("students")
    .select("id, student_name, father_name, mother_name, mobile, email, course_name, status")
    .order("created_at", { ascending: false });

  const list = document.getElementById("studentList");
  list.replaceChildren();

  if (error) {
    message.textContent = "Unable to load students: " + error.message;
    return;
  }

  data.forEach(student => {

    const tr = document.createElement("tr");

    [
      student.student_name,
      student.father_name,
      student.mobile,
      student.course_name,
      student.status
    ].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value || "-";
      tr.appendChild(td);
    });

    const actionTd = document.createElement("td");


    // VIEW BUTTON
    const viewBtn = document.createElement("button");
    viewBtn.textContent = "View";
    viewBtn.style.background = "blue";

    viewBtn.onclick = () => {
      alert(
        "Student Name: " + student.student_name +
        "\nFather Name: " + student.father_name +
        "\nMother Name: " + (student.mother_name || "") +
        "\nMobile: " + student.mobile +
        "\nEmail: " + (student.email || "") +
        "\nCourse: " + student.course_name +
        "\nStatus: " + student.status
      );
    };

    actionTd.appendChild(viewBtn);


    // EDIT BUTTON
    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.style.background = "green";

    editBtn.onclick = async () => {

      const newName = prompt("Student Name:", student.student_name);
      if (newName === null) return;

      const newFather = prompt("Father Name:", student.father_name);
      if (newFather === null) return;

      const newMobile = prompt("Mobile Number:", student.mobile);
      if (newMobile === null) return;

      const newEmail = prompt("Email:", student.email || "");
      if (newEmail === null) return;

      const newCourse = prompt("Course:", student.course_name);
      if (newCourse === null) return;

      if (!newName.trim() || !newFather.trim() || !newMobile.trim() || !newCourse.trim()) {
        alert("Please fill all required details.");
        return;
      }

      const { error } = await db
        .from("students")
        .update({
          student_name: newName.trim(),
          father_name: newFather.trim(),
          mobile: newMobile.trim(),
          email: newEmail.trim(),
          course_name: newCourse.trim()
        })
        .eq("id", student.id);

      if (error) {
        alert("Update Failed: " + error.message);
      } else {
        alert("Student Details Updated Successfully!");
        loadStudents();
      }
    };

    actionTd.appendChild(editBtn);


    // STATUS DROPDOWN
    const statusSelect = document.createElement("select");

    ["New", "Approved", "Rejected"].forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = student.status || "New";

    statusSelect.onchange = async () => {

      const oldStatus = student.status;
      const newStatus = statusSelect.value;

      statusSelect.disabled = true;

      const { error } = await db
        .from("students")
        .update({ status: newStatus })
        .eq("id", student.id);

      if (error) {
        message.textContent = "Status Update Failed: " + error.message;
        statusSelect.value = oldStatus || "New";
      } else {
        student.status = newStatus;
        message.textContent = "Student Status Updated Successfully!";
      }

      statusSelect.disabled = false;
    };

    actionTd.appendChild(statusSelect);


    // DELETE BUTTON
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.style.background = "red";

    deleteBtn.onclick = async () => {

      if (!confirm("Are you sure you want to delete this student?")) {
        return;
      }

      const { error } = await db
        .from("students")
        .delete()
        .eq("id", student.id);

      if (error) {
        alert("Delete failed: " + error.message);
        return;
      }

      alert("Student Deleted Successfully!");
      loadStudents();
    };

    actionTd.appendChild(deleteBtn);

    tr.appendChild(actionTd);
    list.appendChild(tr);

  });

  message.textContent = "Total Students: " + data.length;
}


// REFRESH
document.getElementById("refresh").onclick = loadStudents;


// LOGOUT
document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

</script>

</body>
</html>
